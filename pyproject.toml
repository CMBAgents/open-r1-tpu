[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-r1-tpu"
version = "0.1.0"
description = "TPU-native reasoning distillation recipes built on Tunix"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "datasets>=3.0",
  "gcsfs>=2024.6",
  # Exact-commit pin, deliberately not a PyPI release: the code needs main-only
  # APIs (e.g. WeightedMetric, absent from v0.1.7), and a hash keeps installs
  # byte-stable where a branch ref would drift. See "Tunix compatibility" in
  # AGENTS.md before moving it.
  "google-tunix @ git+https://github.com/google/tunix.git@984bf89b1117c94406dc43e3dfb8d2a198a6353d",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "wandb>=0.22.3",
]

[project.optional-dependencies]
# Benchmark evaluation: the LightEval harness and what it needs to score this
# project's tasks. Optional because a training-only install has no use for it.
#
# Direct dependencies are exact versions from the first successful v6e run;
# uv.lock freezes their transitive closure. Keep these declarations synchronized
# with open_r1_tpu.evaluation.stack -- a unit test enforces the relationship.
eval = [
  # Three LightEval extras, all load-bearing:
  #   extended_tasks - IFEval and friends live under lighteval/tasks/extended.
  #     The task registry imports that tree whether or not a recipe uses it, so
  #     without this even listing tasks fails on a missing emoji import.
  #   litellm - the backend LightEval reaches the local vLLM server through.
  #     Prefer the extra to a bare litellm: it adds the caching support
  #     LightEval expects.
  #   math - latex2sympy2-extended, for symbolic answer equivalence. Without
  #     it maths accuracy falls back to string equality, which understates it
  #     substantially. LightEval used Math-Verify for this until 0.13 and now
  #     parses LaTeX directly, so nothing here should name Math-Verify.
  # Floor at 0.13. 0.11 shipped `hf_repo="lighteval/openai/gsm8k"` in its task
  # table -- a repo id with two slashes, which no Hub lookup can resolve, so
  # GSM8K could not load at all. 0.13 is also the release whose CLI options and
  # ModelConfig fields this package is written against.
  "lighteval[extended_tasks,litellm,math]==0.13.0",
  # LightEval reaches the OpenAI-compatible service through LiteLLM. Declaring
  # it directly prevents the backend protocol from drifting under an unchanged
  # LightEval release.
  "litellm==1.97.0",
  # Symbolic maths scoring moved here in LightEval 0.13.
  "latex2sympy2-extended==1.0.6",
  # Dataset/Hub versions affect task revisions, cache behavior, and therefore
  # which examples are evaluated. They are part of the protocol, not tooling.
  "datasets==5.0.1",
  "huggingface-hub==1.28.0",
  # Reading LightEval's Parquet detail shards.
  "pyarrow==25.0.1",
  # LightEval imports xxhash without declaring it, so the version is whatever
  # `datasets` happens to drag in. 4.0.0 (2026-08-12) stopped accepting str,
  # and LightEval hashes `doc.query` -- a str -- for every sample, so metric
  # computation dies after generation has already been paid for. Pinned here
  # because LightEval cannot pin what it does not declare.
  "xxhash==3.8.1",
]
# vLLM is deliberately absent. Nothing here imports it -- open_r1_tpu.evaluation.run
# starts an external inference service and talks to it over HTTP -- so declaring
# it would buy nothing and cost the install: tpu-inference classifies as Python
# 3.10-3.12 and this project is on 3.13, which makes the extra unresolvable.
# The supported service is the pinned container; custom services can be selected
# with server.serve_command and server.image=null.
test = ["pytest>=8.0"]
# Linters, type checker, and the pre-commit hook. Kept free of the TPU stack
# because none of them need it, not because anything runs off-target.
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1.400",
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Integration tests need a vLLM server already serving the recipe's model. They
# are deselected by default and run with `pytest -m integration` once one is up.
markers = ["integration: needs a live vLLM server"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "models", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "BLE",  # blind except
  "TRY",  # exception antipatterns
  "EXE",  # shebang correctness
  "RUF",  # ruff-specific
]
ignore = [
  # Config and message validation raise ValueError uniformly for every invalid
  # input, type errors included. The contract is asserted by tests; TypeError
  # would split it in two for no operator benefit.
  "TRY004",
  # Failure messages are written at the raise site on purpose, so that a bad
  # recipe explains itself before it wastes TPU time.
  "TRY003",
  # Re-raising as a bare `raise ... from err` chain adds noise to preflight
  # errors that are already the whole story.
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately awkward inputs and stub classes.
"tests/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["open_r1_tpu"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", "data", "models", "artifacts"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Warnings rather than errors so the hook still runs before the environment is
# fully provisioned. On the TPU VM, with the eval extra installed, every import
# resolves and any unresolved-import warning is a real finding.
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
