[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-r1-tpu"
version = "0.1.0"
description = "Supervised fine-tuning, GRPO and benchmark evaluation of language models on TPUs, built on Tunix"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "datasets>=3.0",
  "gcsfs>=2024.6",
  # Exact commit, not a PyPI release: the code needs APIs only on Tunix main
  # (e.g. WeightedMetric, absent from v0.1.7). See "Tunix compatibility" in
  # AGENTS.md before moving it.
  "google-tunix @ git+https://github.com/google/tunix.git@984bf89b1117c94406dc43e3dfb8d2a198a6353d",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "wandb>=0.22.3",
]

[project.urls]
Repository = "https://github.com/CMBAgents/open-r1-tpu"

[project.optional-dependencies]
# Benchmark evaluation. Exact versions; uv.lock freezes the rest. Keep these in
# step with open_r1_tpu.evaluation.stack, which a unit test checks.
eval = [
  # Both LightEval extras are needed:
  #   extended_tasks - the task registry imports lighteval/tasks/extended
  #     (IFEval and others) whether or not a recipe uses it, so without it
  #     even listing tasks fails.
  #   math - latex2sympy2-extended, for symbolic answer equivalence. Without
  #     it maths accuracy falls back to string equality and reads low.
  #     LightEval used Math-Verify for this until 0.13 and now parses LaTeX
  #     directly, so nothing here should name Math-Verify.
  # No litellm extra: open_r1_tpu.evaluation.generate reaches vLLM directly
  # over the openai SDK, and LightEval is used only as a library (task
  # registry, Doc/ModelResponse types, metrics), never for its runner, models
  # or litellm client.
  #
  # 0.13 or later: 0.11's GSM8K task names an unresolvable Hub repo, and
  # evaluation/taskpack.py and evaluation/scoring.py are written against
  # 0.13's internals (their docstrings list which).
  "lighteval[extended_tasks,math]==0.13.0",
  # Symbolic maths scoring moved here in LightEval 0.13.
  "latex2sympy2-extended==1.0.6",
  # Dataset and Hub versions decide task revisions and so which examples are
  # evaluated: part of the protocol, not tooling.
  "datasets==5.0.1",
  "huggingface-hub==1.28.0",
  # LightEval imports xxhash without declaring it. 4.0.0 rejects str, and
  # LightEval hashes each sample's query string, so scoring fails after
  # generation has finished.
  "xxhash==3.8.1",
  # Transport to vLLM, with the project's own retry policy
  # (open_r1_tpu.evaluation.generate).
  "openai==2.54.0",
  # Imported only when an evaluation is given a tracing config
  # (open_r1_tpu.evaluation.traced).
  "langfuse==4.14.5",
]
# vLLM is deliberately absent: the evaluation talks to an external inference
# service over HTTP, and tpu-inference supports only Python 3.10-3.12, which
# would make this extra unresolvable on 3.13. The supported service is the
# pinned container; select another with server.serve_command and
# server.image=null.
test = ["pytest>=8.0"]
# Linters, type checker and pre-commit; none of them need the TPU stack.
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1.400",
  "pytest>=8.0",
  "ruff>=0.14",
]

[project.scripts]
open-r1-tpu-sft = "open_r1_tpu.sft.run:main"
open-r1-tpu-sft-preflight = "open_r1_tpu.sft.preflight:main"
open-r1-tpu-grpo = "open_r1_tpu.grpo.run:main"
open-r1-tpu-eval = "open_r1_tpu.evaluation.run:main"
open-r1-tpu-eval-preflight = "open_r1_tpu.evaluation.preflight:main"
open-r1-tpu-taskpack = "open_r1_tpu.evaluation.taskpack:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Tests that need LightEval skip themselves without the eval extra. Two kinds are
# deselected by default: `integration` needs a vLLM server already serving the
# recipe's model, and `network` downloads datasets from the Hugging Face Hub.
# Select them with `pytest -m integration` or `pytest -m network`.
markers = [
  "integration: needs a live vLLM server",
  "network: needs Hugging Face Hub access",
]
addopts = "-m 'not integration and not network'"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "models", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "BLE",  # blind except
  "TRY",  # exception antipatterns
  "EXE",  # shebang correctness
  "RUF",  # ruff-specific
]
ignore = [
  # Config and message validation raise ValueError uniformly for every invalid
  # input, type errors included. The contract is asserted by tests; TypeError
  # would split it in two for no operator benefit.
  "TRY004",
  # Failure messages are written at the raise site on purpose, so that a bad
  # recipe explains itself before it wastes TPU time.
  "TRY003",
  # Re-raising as a bare `raise ... from err` chain adds noise to preflight
  # errors that are already the whole story.
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately awkward inputs and stub classes.
"tests/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["open_r1_tpu"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", "data", "models", "artifacts"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Warnings rather than errors so the hook still runs before the environment is
# fully provisioned. On the TPU VM, with the eval extra installed, every import
# resolves and any unresolved-import warning is a real finding.
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
