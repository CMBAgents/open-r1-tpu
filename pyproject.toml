[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-r1-tpu"
version = "0.1.0"
description = "TPU-native reasoning distillation recipes built on Tunix"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "datasets>=3.0",
  "gcsfs>=2024.6",
  # Exact-commit pin, deliberately not a PyPI release: the code needs main-only
  # APIs (e.g. WeightedMetric, absent from v0.1.7), and a hash keeps installs
  # byte-stable where a branch ref would drift. See "Tunix compatibility" in
  # AGENTS.md before moving it.
  "google-tunix @ git+https://github.com/google/tunix.git@984bf89b1117c94406dc43e3dfb8d2a198a6353d",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "wandb>=0.22.3",
]

[project.optional-dependencies]
# Benchmark evaluation: the vLLM server, the LightEval harness, and Math-Verify
# for symbolic answer equivalence. Optional because a training-only install has
# no use for them, not because they conflict with anything.
#
# Nothing here is pinned yet. The evaluation protocol wants a frozen, recorded
# stack, but pinning versions that have never run on this hardware would be
# false precision; open_r1_tpu.evaluate records the installed versions in every
# summary, which is what the first successful run should pin from.
eval = [
  # The math extra brings Math-Verify. Without it maths accuracy is scored by
  # string equality, which understates it substantially.
  "lighteval[math]",
  # The backend LightEval reaches the local vLLM server through.
  "litellm",
  # Reading LightEval's Parquet detail shards.
  "pyarrow>=15.0",
]
# vLLM is deliberately absent. Nothing here imports it -- open_r1_tpu.evaluate
# starts `vllm serve` as a subprocess and talks to it over HTTP -- so declaring
# it would buy nothing and cost the install: tpu-inference classifies as Python
# 3.10-3.12 and this project is on 3.13, which makes the extra unresolvable.
# Treat vLLM as an external service and point server.serve_command at it.
test = ["pytest>=8.0"]
# Linters, type checker, and the pre-commit hook. Kept free of the TPU stack
# because none of them need it, not because anything runs off-target.
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1.400",
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Integration tests need a vLLM server already serving the recipe's model. They
# are deselected by default and run with `pytest -m integration` once one is up.
markers = ["integration: needs a live vLLM server"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "models", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "BLE",  # blind except
  "TRY",  # exception antipatterns
  "EXE",  # shebang correctness
  "RUF",  # ruff-specific
]
ignore = [
  # Config and message validation raise ValueError uniformly for every invalid
  # input, type errors included. The contract is asserted by tests; TypeError
  # would split it in two for no operator benefit.
  "TRY004",
  # Failure messages are written at the raise site on purpose, so that a bad
  # recipe explains itself before it wastes TPU time.
  "TRY003",
  # Re-raising as a bare `raise ... from err` chain adds noise to preflight
  # errors that are already the whole story.
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately awkward inputs and stub classes.
"tests/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["open_r1_tpu"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", "data", "models", "artifacts"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Warnings rather than errors so the hook still runs before the environment is
# fully provisioned. On the TPU VM, with the eval extra installed, every import
# resolves and any unresolved-import warning is a real finding.
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
