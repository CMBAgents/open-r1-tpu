[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-r1-tpu"
version = "0.1.0"
description = "TPU-native reasoning distillation recipes built on Tunix"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "datasets>=3.0",
  "gcsfs>=2024.6",
  "google-tunix @ git+https://github.com/google/tunix.git@984bf89b1117c94406dc43e3dfb8d2a198a6353d",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "wandb>=0.22.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
