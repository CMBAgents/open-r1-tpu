# Tier 1: the decision tier. Run on every checkpoint worth keeping, ~1 hour.
#
# This is the tier that decides whether a recipe change helped. MATH-500 is the
# workhorse: 500 problems is large enough that three seeds pin the mean down,
# and it spans difficulty rather than clustering at the top like GSM8K or at the
# ceiling like AIME. GSM8K stays in as the floor -- a model that regresses there
# has lost basic arithmetic competence, whatever it gained elsewhere.
#
# Three seeds, not one. Seed variance alone moves reasoning benchmarks by 5-15
# points (arXiv 2504.07086), which is larger than most recipe changes are worth,
# so a single number cannot tell an improvement from noise. Three is the
# documented minimum for a benchmark this size.
#
# The comparison this tier is for is against recipes/Qwen3-1.7B-Math's tier 1:
# same corpus, same prompt, same protocol, different base model and window. It
# is not the card's MATH-500 83.9, which DeepSeek measured at a 32768-token
# budget; see base.yaml for how to run that protocol against this export.
#
# Identical to recipes/Qwen3-1.7B-Math/eval/tier1_core.yaml apart from the
# paths; tests/test_evaluate.py holds the two together.
extends: base.yaml

eval:
  tier: tier1-core
  tasks:
    - "math_500|0"
    - "gsm8k|0"
    # AMC23 is not in LightEval's table -- Open-R1 carries it as a custom
    # task. Left out rather than vendored: 40 problems swing 2.5pp per
    # question, so it decides nothing that MATH-500 does not.
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 20480

sampling:
  # The DeepSeek-R1 recommended settings, which is what most published numbers
  # for distilled reasoning models use. Greedy decoding on a reasoning model
  # collapses into repetition often enough not to be a safe default, and it
  # makes pass@k meaningless.
  temperature: 0.6
  top_p: 0.95
  # Deliberately large. A trace cut off by the cap scores as wrong and reads as
  # a reasoning failure, so an undersized cap silently understates the model.
  # Watch generation.truncation_rate in the summary: if it is not near zero,
  # this number is too low and the accuracy below it is not trustworthy. That
  # check matters more for this export than for the Qwen3 one: it was trained
  # on whole traces up to 25,733 tokens rather than on the under-4096 subset,
  # so it has seen, and may reproduce, traces longer than this cap.
  max_new_tokens: 16384
  system_prompt_file: recipes/OpenR1-Distill-Qwen2.5-Math-1.5B/system_prompt.txt

reporting:
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/eval/tier1
  wandb:
    enabled: true
    run_name: qwen2.5-math-1.5b-r1-distill-tier1
    tags: [tpu, eval, math]
