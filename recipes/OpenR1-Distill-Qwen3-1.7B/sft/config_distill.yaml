# Single-device TPU v6e-1 (32 GiB HBM) reasoning-distillation recipe. The
# batch/sequence defaults match the topology already validated by a smoke run;
# increase max_length only after measuring HBM use and retained-example count.
model:
  model_name: qwen3-1.7b-base
  model_id: Qwen/Qwen3-1.7B-Base
  model_source: huggingface
  model_path: ""
  model_download_path: /tmp/open-r1-tpu/models/qwen3-1.7b-base
  intermediate_ckpt_dir: /tmp/open-r1-tpu/intermediate_ckpt
  rng_seed: 42
  model_display: false
  dtype: bfloat16
  load_dtype: bfloat16
  remat_config: DECODER
  use_flash_attention: true
  flash_attention_block_size: 1024
  lora_config:
    module_path: ".*q_proj|.*k_proj|.*v_proj|.*o_proj|.*gate_proj|.*up_proj|.*down_proj"
    rank: 64
    alpha: 64.0
  mesh:
    shape: [1, 1]
    axis_names: [fsdp, tp]

tokenizer:
  tokenizer_path: Qwen/Qwen3-1.7B-Base
  tokenizer_type: huggingface
  add_bos: false
  add_eos: false
  chat_template: null

dataset:
  name: open-r1/Mixture-of-Thoughts
  config: all
  train_split: train
  messages_column: messages
  # One 1024-token sequence per microbatch is the validated 32 GiB baseline.
  # Gradient accumulation below gives an effective batch size of eight.
  batch_size: 1
  max_length: 1024
  # Match Open-R1's SFT recipe and provide enough data after length filtering.
  num_train_epochs: 5
  max_examples: null
  # A held-out split is the only quantitative check on overfitting. The cap
  # keeps evaluation to a bounded number of steps: a fraction of a corpus this
  # size would otherwise take thousands of steps at batch size one.
  eval_fraction: 0.01
  eval_max_examples: 64
  seed: 42
  assistant_only_loss: true
  require_reasoning_tags: true
  reasoning_start: <think>
  reasoning_end: </think>
  system_prompt_file: recipes/OpenR1-Distill-Qwen3-1.7B/system_prompt.txt

optimizer:
  learning_rate: 4.0e-5
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  b1: 0.9
  b2: 0.99
  eps: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 0.2

training:
  # Full Open-R1 runs should tune this for the selected dataset and topology.
  # A finite value also makes checkpoint resume behavior unambiguous.
  max_steps: 5000
  gradient_accumulation_steps: 8
  eval_every_n_steps: 500
  checkpoint_dir: artifacts/OpenR1-Distill-Qwen3-1.7B/checkpoints
  checkpointing_options:
    save_interval_steps: 250
    max_to_keep: 2
    enable_async_checkpointing: true
    timeout_secs: 1200
  metrics_log_dir: artifacts/OpenR1-Distill-Qwen3-1.7B/logs
  project_name: open-r1-tpu
  run_name: qwen3-1.7b-reasoning-sft
  flush_every_n_steps: 10
  wandb:
    enabled: true
    # Leave null to use WANDB_ENTITY or the account's default entity.
    entity: null
    mode: online
    group: qwen3-1.7b-reasoning-distillation
    job_type: sft
    tags: [tpu, sft, lora, qwen3]
    resume: allow
    save_code: true
  # Free-running samples for qualitative inspection. Disabled by default: they
  # add an autoregressive decode, a second XLA compilation, and a KV cache to a
  # single-device memory profile validated without them. Enable with
  # training.transcripts.enabled=true once you have HBM headroom to spare.
  transcripts:
    enabled: false
    every_n_steps: 500
    max_new_tokens: 256
    # Greedy decoding keeps successive samples comparable across steps.
    temperature: 0.0
    seed: 42
    log_to_wandb: true
    output_path: artifacts/OpenR1-Distill-Qwen3-1.7B/transcripts.jsonl
    # Leave null to use the built-in prompt set.
    prompts: null
    # Defaults to max_prompt_length + max_new_tokens.
    cache_size: null
    # Prompts are padded to this length before prefill. Leave null to derive it
    # from model.flash_attention_block_size: the splash attention kernel
    # requires its block size to divide the prompt length, and short prompts
    # would otherwise pad to a smaller power of two and fail.
    max_prompt_length: null
  data_sharding_axis: [fsdp]
  max_inflight_computations: 1

export:
  enabled: true
  overwrite: true
  output_dir: artifacts/OpenR1-Distill-Qwen3-1.7B/merged
