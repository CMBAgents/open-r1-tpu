# Shared settings for the eval tiers of the SimpleRL-Zoo GRPO positive control
# (../grpo/simplerl-zoo.yaml). Three models run the same tiers, changing only
# server.model_path (and reporting.output_dir and reporting.wandb.run_name):
# the base Qwen/Qwen2.5-1.5B, the published hkust-nlp/Qwen-2.5-1.5B-SimpleRL-Zoo
# (the target), and this project's GRPO export (the default below).
#
# SimpleRL-Zoo trained and scored with a plain-text prompt and extra stop
# tokens, so each model is served from a staged copy that carries the GRPO
# recipe's chat template, its stop tokens as generation_config.json's
# eos_token_id, and no sampling defaults. Stage all three on the VM:
#   hf download hkust-nlp/Qwen-2.5-1.5B-SimpleRL-Zoo \
#     --local-dir models/Qwen-2.5-1.5B-SimpleRL-Zoo
#   for pair in \
#     models/Qwen2.5-1.5B:models/Qwen2.5-1.5B-eval \
#     models/Qwen-2.5-1.5B-SimpleRL-Zoo:models/Qwen-2.5-1.5B-SimpleRL-Zoo-eval \
#     artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/merged:artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/merged-eval
#   do
#     python scripts/stage_eval_model.py \
#       --recipe recipes/Qwen2.5-1.5B/grpo/simplerl-zoo.yaml \
#       --source "${pair%%:*}" --output "${pair##*:}"
#   done
#
# The reported numbers served all three in bfloat16, adding
# "server.extra_args=[--dtype,bfloat16]" and pinning the server to one chip
# (TPU_VISIBLE_CHIPS=0, TPU_CHIPS_PER_PROCESS_BOUNDS=1,1,1,
# TPU_PROCESS_BOUNDS=1,1,1). SimpleRL-Zoo's checkpoint is float32, which vLLM
# TPU keeps despite --dtype and then fails to serve, so its staged copy was
# cast to bfloat16 first. GSM8K was scored on its first 200 problems.
#
# Still unlike theirs: LightEval's scorers, not Qwen2.5-Math's grader; three
# seeds, not one; and their stop strings "Question:" and "Answer:" become
# tokens, which also stop at a line-initial "Question" or "Answer".

server:
  model_path: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/merged-eval
  served_model_name: null
  # The Abel template ends an assistant turn with <|endoftext|>, the first
  # stop token in every staged generation_config.json.
  turn_end_token: <|endoftext|>
  serve_command: ["scripts/run_vllm_tpu_container.sh"]
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 1
  startup_timeout_secs: 900
  # Qwen2.5-1.5B declares 131072 positions, above every tier's window. For a
  # model that declares fewer, add --hf-overrides as
  # ../../Qwen2.5-Math-1.5B/eval/base.yaml does.
  extra_args: []
  max_concurrency: 8
  fail_fast_after: 10

reporting:
  summary_path: null
  # SimpleRL-Zoo trains no <think> block, so the closure statistics read zero
  # here. Watch the answer-marker rate instead: learning to box the answer is
  # part of what the RL run buys.
  reasoning_start: <think>
  reasoning_end: </think>
  answer_marker: "\\boxed{"
  wandb:
    project_name: open-r1-tpu
    entity: null
    mode: online
    job_type: eval
    run_id: null
