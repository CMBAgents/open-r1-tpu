# Tier 1: GSM8K and MATH-500, the benchmarks with a published before/after row
# for Qwen2.5-1.5B, at SimpleRL-Zoo's generation settings (temperature 1.0,
# top-p 0.95, 16,000 tokens) over three seeds where they took one sample. Run
# it once per model base.yaml lists, for example:
#   RECIPE=recipes/Qwen2.5-1.5B/eval/tier1_core.yaml ./scripts/run_eval_tpu.sh \
#     server.model_path=models/Qwen-2.5-1.5B-SimpleRL-Zoo-eval \
#     reporting.output_dir=artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/eval/tier1-published \
#     reporting.wandb.run_name=qwen2.5-1.5b-simplerl-zoo-published-tier1
# Their base row was greedy; for the base, add sampling.temperature=0.0
# sampling.top_p=1.0 eval.seeds=[0]. Measured: the GRPO export GSM8K 68.2
# (first 200 problems) and MATH-500 54.7; their checkpoint 74.5 and 57.2.
#
# 1,819 problems x 3 seeds. The stop tokens end most answers within a few
# hundred tokens; watch generation.truncation_rate for any that never stop.
extends: base.yaml

eval:
  tier: tier1-core
  tasks:
    - "gsm8k|0"
    - "math_500|0"
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 16896

sampling:
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 16000
  # The Abel prompt has no system turn, and the chat template would drop one.
  system_prompt_file: null

reporting:
  output_dir: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/eval/tier1
  wandb:
    enabled: true
    run_name: qwen2.5-1.5b-simplerl-zoo-grpo-tier1
    tags: [tpu, eval, math, simplerl-zoo, positive-control]
