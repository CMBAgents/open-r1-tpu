# GRPO positive control: Qwen2.5-1.5B (base) with SimpleRL-Zoo's data and
# settings, to check this pipeline against a published RL result. SimpleRL-Zoo
# (arXiv 2503.18892; github.com/hkust-nlp/simpleRL-reason, branch v1) reports
# GSM8K 55.7 -> 74.4 and MATH-500 29.6 -> 59.0 for this base. Tested on a TPU
# v6e-4: 400 steps in about 14 hours, peak HBM 20.5 of 31.25 GiB per chip.
# ../eval/tier1_core.yaml scored the export GSM8K 68.2 (first 200 problems) and
# MATH-500 54.7, against 74.5 and 57.2 for their released checkpoint. A run that
# stays at the base's score, or collapses, means the pipeline is broken. What
# is copied from SimpleRL-Zoo, and what differs, is noted at each setting.
#
# Stage on the VM, then launch:
#   hf download hkust-nlp/SimpleRL-Zoo-Data --repo-type dataset \
#     --include "simplelr_abel_level3to5/*" --local-dir data/SimpleRL-Zoo-Data
#   hf download Qwen/Qwen2.5-1.5B --local-dir models/Qwen2.5-1.5B
#   python -m open_r1_tpu.grpo.run \
#     --config recipes/Qwen2.5-1.5B/grpo/simplerl-zoo.yaml
# Smoke first with training.max_steps=3 dataset.eval_max_examples=4
# training.wandb.enabled=false export.enabled=false and separate checkpoint, log
# and rollout paths. The step-0 eval should score about 6%.
model:
  model_name: qwen2.5-1.5b
  model_id: Qwen/Qwen2.5-1.5B
  model_source: local
  model_path: models/Qwen2.5-1.5B
  model_download_path: /tmp/open-r1-tpu/models/Qwen2.5-1.5B
  intermediate_ckpt_dir: /tmp/open-r1-tpu/intermediate_ckpt/simplerl-zoo-grpo
  rng_seed: 42
  model_display: false
  # Float32 and plain attention, or the rollouts are corrupt. Tunix's sampler
  # prefill passes no segment_ids to splash attention, so prompts attend to
  # their left padding (gibberish). In bfloat16, Qwen2.5's attention biases
  # overflow (runs of "!") and the loss is NaN by step 2.
  dtype: float32
  load_dtype: float32
  remat_config: DECODER
  use_flash_attention: false
  # Used only by splash attention: must divide the rollout prefill (512) and
  # prompt plus completion (2,560).
  flash_attention_block_size: 512
  rope_theta: 1000000
  # LoRA, not their full fine-tune: the GRPO actor is always a LoRA adapter.
  # LoRA matches full fine-tuning for RL at about ten times the learning rate,
  # hence optimizer.learning_rate.
  lora_config:
    module_path: ".*q_proj|.*k_proj|.*v_proj|.*o_proj|.*gate_proj|.*up_proj|.*down_proj"
    rank: 64
    alpha: 64.0
  # Four chips, each holding a quarter of both models.
  mesh:
    shape: [4, 1]
    axis_names: [fsdp, tp]

tokenizer:
  tokenizer_path: models/Qwen2.5-1.5B
  tokenizer_type: huggingface
  add_bos: false
  add_eos: false
  # SimpleRL-Zoo's plain-text "Abel" prompt as a chat template: a user turn
  # becomes "Question:\n{content}\nAnswer:\nLet's think step by step.\n", and
  # an assistant turn ends in <|endoftext|>, which the export writes as the
  # turn-end token. The two `if`s fire only at evaluation, unwrapping
  # LightEval's GSM8K and MATH-500 prompts back to the bare problem.
  # scripts/stage_eval_model.py copies this template into each model ../eval
  # serves.
  chat_template: "{% for message in messages %}{% if message['role'] == 'user' %}{% set q = message['content'] %}{% if q.startswith('Question: ') and q.endswith('\nAnswer:') %}{% set q = q[10:-8] %}{% endif %}{% if q.startswith('Solve the following problem. The final line of your response MUST be') and '\n\n' in q %}{% set q = q.split('\n\n', 1)[1] %}{% endif %}Question:\n{{ q }}\nAnswer:\nLet's think step by step.\n{% elif message['role'] == 'assistant' %}{{ message['content'] }}<|endoftext|>{% endif %}{% endfor %}"

dataset:
  # simplelr_abel_level3to5: the 8,523 MATH level 3-5 problems their 1.5B
  # trained on.
  name: parquet
  config: null
  train_split: train
  data_files: data/SimpleRL-Zoo-Data/simplelr_abel_level3to5/train.parquet
  # The bare problem; the chat template adds the Abel wrapper, which the
  # file's own `prompt` column already has applied.
  question_column: question
  answer_column: gt_answer
  # 16 prompts x 8 rollouts and one update per step. Theirs is 1,024 prompts
  # split into 4 updates for about 120 steps: a similar number of updates from
  # about 1/20th of the rollouts here, each noisier. Extend training.max_steps
  # (the run resumes) if eval reward is still rising.
  batch_size: 16
  # Filters by tokens, not their 1,024 characters: keeps 39 of the 108 long
  # problems theirs drops.
  max_prompt_length: 512
  # 400 steps x 16 = 6,400 prompts, under one pass over the 8,458 training
  # rows; the second epoch is headroom for extending max_steps.
  num_train_epochs: 2
  max_examples: null
  # 65 rows held out, capped at 64, which Tunix samples every
  # training.eval_every_n_steps at the training temperature.
  eval_fraction: 0.0076
  eval_max_examples: 64
  # Tunix scores each eval batch's rollouts in one pass; with Qwen's ~152k
  # vocabulary only one prompt's 8 fit.
  eval_batch_size: 1
  seed: 42
  # SimpleRL-Zoo's prompt has no system turn.
  system_prompt_file: null

optimizer:
  # AdamW, weight decay and clip as theirs. Constant after a 4-step warm-up,
  # as theirs is constant.
  learning_rate: 5.0e-6
  warmup_ratio: 0.01
  min_lr_ratio: 1.0
  b1: 0.9
  b2: 0.999
  eps: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0

training:
  # Logits one prompt (8 sequences) at a time; rollouts 4 prompts (32
  # sequences) at a time. Raise rollout_micro_batch_size for speed only after
  # a smoke run has measured HBM.
  train_micro_batch_size: 1
  compute_logps_micro_batch_size: 1
  rollout_micro_batch_size: 4
  max_steps: 400
  checkpoint_dir: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/checkpoints
  checkpointing_options:
    save_interval_steps: 50
    max_to_keep: 10
    enable_async_checkpointing: false
    timeout_secs: 1200
  eval_every_n_steps: 50
  eval_rollouts_path: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/eval_rollouts.jsonl
  metrics_log_dir: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/logs
  project_name: open-r1-tpu
  run_name: qwen2.5-1.5b-simplerl-zoo-grpo-v1
  flush_every_n_steps: 5
  wandb:
    enabled: true
    entity: null
    mode: online
    group: qwen2.5-1.5b-simplerl-zoo
    job_type: grpo
    tags: [tpu, grpo, rl, qwen2.5, math, positive-control, v6e-4, fp32]
    resume: allow
    save_code: false
  offload_to_cpu: false

grpo:
  # Theirs: a 1/0 correctness reward with no format reward, 8 rollouts per
  # prompt, clip 0.2, KL 1e-4 with the low-variance estimator, token-mean
  # loss. math_answer_reward reads the answer in their order but grades with a
  # string normaliser, not math_verify. No entropy bonus (theirs is 0.001):
  # the pinned Tunix GRPO has none.
  reward_functions: [math_answer_reward]
  num_generations: 8
  num_iterations: 1
  beta: 1.0e-4
  epsilon: 0.2
  loss_agg_mode: token-mean
  kl_loss_mode: low_var_kl

rollout:
  max_prompt_length: 512
  # Not their 8,192: their stops end most answers well before this, and the
  # logits for 8 x 2,560 tokens are what fit beside two 1.5B models. About
  # 1-2% of rollouts hit the cap. If HBM is short, lower this (and
  # kv_cache_size) first.
  max_tokens_to_generate: 2048
  kv_cache_size: 2816
  # As theirs: no top-p or top-k cut.
  temperature: 1.0
  top_p: 1.0
  top_k: null
  # <|endoftext|>, <|im_end|>, "Question", "Answer", "Problem". Their rollout
  # stops on the last three so a base model does not run on into an invented
  # next problem, and their reward cuts the text at <|im_end|>.
  eos_token_ids: [151643, 151645, 14582, 16141, 31198]

export:
  # The merged export ../eval serves.
  enabled: true
  overwrite: true
  output_dir: artifacts/Qwen2.5-1.5B-SimpleRL-Zoo/grpo/merged
