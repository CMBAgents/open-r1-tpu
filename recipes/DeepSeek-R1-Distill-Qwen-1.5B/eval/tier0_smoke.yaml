# Tier 0: the smoke test on the reference model, the same greedy pass over 200
# GSM8K problems as ../../Qwen2.5-Math-1.5B/eval/tier0_smoke.yaml. Greedy
# despite DeepSeek's warning that the distills can loop without sampling: a
# loop is what this tier exists to surface, and its number is a tripwire, not
# a result.
extends: base.yaml

eval:
  tier: tier0-smoke
  tasks:
    - "gsm8k|0"
  # Greedy decoding has no sampling variance to average out.
  seeds: [0]
  # Enough to expose a systematic format failure, far too few to score.
  max_samples: 200

server:
  max_model_len: 12288

sampling:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 8192
  # No system prompt, per DeepSeek's guidance for the distills: the chat
  # template already opens the reasoning block, and the card was measured
  # this way.
  system_prompt_file: null

reporting:
  output_dir: artifacts/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier0
  wandb:
    enabled: false
    run_name: deepseek-r1-distill-qwen-1.5b-tier0
    tags: [tpu, eval, smoke, reference]
