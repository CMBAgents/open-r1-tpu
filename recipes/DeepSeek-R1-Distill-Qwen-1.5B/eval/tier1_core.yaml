# Tier 1: MATH-500 under the project's comparison protocol, not the card's.
# Task, seeds, sampling and context window match
# ../../Qwen2.5-Math-1.5B/eval/tier1_core.yaml (tests/test_evaluate.py keeps
# them matched). Only the prompt differs: this model runs without a system
# prompt, per DeepSeek's guidance, while the project's exports keep the one
# they were trained with. Measured: pass@1 0.798 +/- 0.013, 4.5% truncated.
#
# The card's 83.9 was measured at a 32768-token budget with four replicates,
# and at 16384 tokens a trace the model would have finished later scores as
# wrong. To replicate the card row, override
#   sampling.max_new_tokens=32768 server.max_model_len=36864 eval.seeds=[0,1,2,3]
extends: base.yaml

eval:
  tier: tier1-core
  tasks:
    - "math_500|0"
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 20480

sampling:
  # DeepSeek's recommended settings, which the card uses.
  temperature: 0.6
  top_p: 0.95
  # The comparison budget, not the card's 32768; watch
  # generation.truncation_rate.
  max_new_tokens: 16384
  # No system prompt, per DeepSeek's guidance for the distills.
  system_prompt_file: null

reporting:
  output_dir: artifacts/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier1
  wandb:
    enabled: true
    run_name: deepseek-r1-distill-qwen-1.5b-tier1
    tags: [tpu, eval, math, reference, comparison]
