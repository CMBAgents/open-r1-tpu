# Tier 1: MATH-500 under the project's shared comparison protocol.
#
# Since 2026-09-03 this tier no longer replicates the card's MATH-500 row. It
# exists so the published distill and this project's own 1.5B export
# (recipes/OpenR1-Distill-Qwen2.5-Math-1.5B) are measured on the same
# benchmark under the same generation parameters: the same task list, seeds,
# temperature, top-p, token budget and context window as that recipe's tier 1
# (and recipes/Qwen3-1.7B-Math's, which it mirrors); tests/test_evaluate.py
# holds the protocols together. The one deliberate asymmetry is the prompt
# side: this model runs without a system prompt, per DeepSeek's usage
# guidance, while the project exports keep the system prompt they were
# trained with -- each model is asked the way it is meant to be asked, and
# the shared parameters are the ones that shape generation itself.
#
# The published MATH-500 83.9 was measured at a 32768-token budget with four
# replicates, so THE NUMBER THIS TIER PRODUCES IS NOT THAT ROW. At 16384
# tokens a trace the model would have finished in 20k scores as wrong;
# generation.truncation_rate in the summary says how much of that happened.
# To replicate the card row instead, override:
#   sampling.max_new_tokens=32768 server.max_model_len=36864
# (the card protocol also used a fourth replicate).
#
# GPQA Diamond, which ran here while this tier replicated the card, moved to
# tier5_gpqa.yaml with its card protocol intact.
extends: base.yaml

eval:
  tier: tier1-core
  tasks:
    - "math_500|0"
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 20480

sampling:
  # The DeepSeek-recommended settings; the card's own numbers use them and
  # the comparison recipes' tier 1 files carry the same values.
  temperature: 0.6
  top_p: 0.95
  # The comparison budget, not the card's 32768. Matched to the project
  # tiers so both models run out of the same window; watch
  # generation.truncation_rate, which reads on this model exactly as it does
  # on the project export.
  max_new_tokens: 16384
  # No system prompt, per DeepSeek's usage guidance for the distills. The
  # chat template already opens the reasoning block, and the published
  # numbers were measured this way.
  system_prompt_file: null

reporting:
  output_dir: artifacts/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier1
  wandb:
    enabled: true
    run_name: deepseek-r1-distill-qwen-1.5b-tier1
    tags: [tpu, eval, math, reference, comparison]
