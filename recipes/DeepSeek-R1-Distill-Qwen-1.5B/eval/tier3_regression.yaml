# Tier 3: the only tier here that carries no card row. What DeepSeek's
# math-and-reasoning distillation cost in general assistant behaviour, as the
# reference point for the same question about this project's own models.
#
# GPQA Diamond used to run here and has moved to tier 1, which fixed a latent
# measurement bug as well as grouping the card rows sensibly: this tier's
# 4096-token budget is far below what a long-CoT model needs on graduate-level
# science, so GPQA scored here would have been dominated by truncation rather
# than by knowledge. IFEval genuinely is a short-generation benchmark, so the
# budget is right for what is left.
#
# ONLY GENERATIVE TASKS WORK HERE: an OpenAI-compatible endpoint returns no
# per-token log probabilities, so LightEval's loglikelihood-scored tasks
# cannot run through this backend. See the Qwen3-1.7B-Math tier 3 for the
# full reasoning.
extends: base.yaml

eval:
  tier: tier3-regression
  tasks:
    - "ifeval|0"
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 8192

sampling:
  temperature: 0.6
  top_p: 0.95
  # Shorter than every other tier: IFEval is not a long-CoT benchmark, and
  # nothing here is being compared against a published number measured at
  # 32768.
  max_new_tokens: 4096
  # Null here matches the other tiers for this model rather than differing
  # from them: DeepSeek's distills run without a system prompt everywhere.
  system_prompt_file: null

reporting:
  output_dir: artifacts/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier3
  wandb:
    enabled: true
    run_name: deepseek-r1-distill-qwen-1.5b-tier3
    tags: [tpu, eval, regression, reference]
