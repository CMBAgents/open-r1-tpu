# Tier 3: IFEval, the one tier here with no card row. It measures what
# DeepSeek's reasoning distillation cost in instruction following, as the
# reference for ../../Qwen2.5-Math-1.5B/eval/tier3_regression.yaml. GPQA runs
# in tier 5 instead, since at this 4096-token budget it would mostly measure
# truncation. Only generative tasks run on this backend; that file's header
# says why.
extends: base.yaml

eval:
  tier: tier3-regression
  tasks:
    - "ifeval|0"
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 8192

sampling:
  temperature: 0.6
  top_p: 0.95
  # IFEval is not a long-reasoning benchmark.
  max_new_tokens: 4096
  # No system prompt, as in every tier for this model.
  system_prompt_file: null

reporting:
  output_dir: artifacts/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier3
  wandb:
    enabled: true
    run_name: deepseek-r1-distill-qwen-1.5b-tier3
    tags: [tpu, eval, regression, reference]
