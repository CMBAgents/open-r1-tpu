# Shared settings for the eval tiers of DeepSeek-R1-Distill-Qwen-1.5B, the
# published distill the Qwen2.5-Math-1.5B SFT is measured against. Tiers 2, 4
# and 5 replicate its model card rows at the card's protocol (32768-token
# budget, the card's replicate counts, no system prompt). Tiers 0 and 1 match
# ../../Qwen2.5-Math-1.5B/eval's tiers of the same number, so the two compare
# directly; tier 3 is the reference for that directory's regression tier.
#
# | Row                    | Published | Tier |
# | ---------------------- | --------- | ---- |
# | AIME 2024 pass@1       | 28.9      | 2    |
# | AIME 2024 cons@64      | 52.7      | 2    |
# | MATH-500 pass@1        | 83.9      | 1*   |
# | GPQA Diamond pass@1    | 33.8      | 5    |
# | LiveCodeBench pass@1   | 16.9      | 4    |
# | CodeForces rating      | 954       | —    |
#
# *Tier 1 uses the comparison protocol; its header gives the overrides for the
# card's. CodeForces is a rating from contest placement, not an accuracy, and
# LightEval 0.13.0 has no task for it, so it is not approximated.
#
# Stage the weights and run a tier on one v6e chip:
#   hf download deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B \
#     --local-dir models/DeepSeek-R1-Distill-Qwen-1.5B
#   RECIPE=recipes/DeepSeek-R1-Distill-Qwen-1.5B/eval/tier0_smoke.yaml ./scripts/run_eval_tpu.sh

server:
  # Each tier sets max_model_len, which must exceed its
  # sampling.max_new_tokens with room for the prompt.
  model_path: models/DeepSeek-R1-Distill-Qwen-1.5B
  served_model_name: null
  # DeepSeek's template ends each turn with this token, id 151643, which its
  # generation_config.json names as the EOS. The bars are full-width
  # characters and must match the tokeniser's exactly.
  turn_end_token: <｜end▁of▁sentence｜>
  serve_command: ["scripts/run_vllm_tpu_container.sh"]
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 1
  # First start includes weight transfer and XLA compilation.
  startup_timeout_secs: 900
  extra_args: []
  # Concurrent chat requests. At the card tiers' 36,864-token window, eight
  # sequences take about 8 GiB of KV cache on a 32 GiB v6e chip, so decode
  # throughput, not memory, sets this.
  max_concurrency: 8
  # Consecutive failed requests, each after its own retries, before the tier
  # stops.
  fail_fast_after: 10

reporting:
  summary_path: null
  # Null: the chat template opens <think> in the prompt, so a completion never
  # carries the opening tag, and a trace counts as closed when </think>
  # appears.
  reasoning_start: null
  reasoning_end: </think>
  answer_marker: "\\boxed{"
  wandb:
    project_name: open-r1-tpu
    entity: null
    mode: online
    job_type: eval
    run_id: null
