# Shared across every DeepSeek-R1-Distill-Qwen-1.5B eval tier.
#
# **These recipes replicate the published model card table**, row for row:
#
# | Row                    | Published | Tier |
# | ---------------------- | --------- | ---- |
# | AIME 2024 pass@1       | 28.9      | 2    |
# | AIME 2024 cons@64      | 52.7      | 2    |
# | MATH-500 pass@1        | 83.9      | 1    |
# | GPQA Diamond pass@1    | 33.8      | 1    |
# | LiveCodeBench pass@1   | 16.9      | 4    |
# | CodeForces rating      | 954       | —    |
#
# CodeForces has no tier because it cannot be measured here: LightEval 0.13.0
# ships no CodeForces task and no Elo harness, and the published 954 is a
# rating derived from percentile placement against human contestants on ten
# Div.2 contests, not a benchmark accuracy. Nothing in this directory
# approximates it, deliberately -- a made-up proxy compared against 954 would
# be worse than an absent number.
#
# **This is a change of purpose, and it costs something.** These recipes used
# to mirror `recipes/Qwen3-1.7B-Math/eval/` task-for-task and seed-for-seed,
# so the reference model and this project's own models were directly
# comparable on this stack. Replicating the card instead means matching
# DeepSeek's protocol -- their token budget, their sample counts, their task
# list -- which is a different thing, and tiers 1, 2 and 4 no longer line up
# with the Qwen3-1.7B-Math tiers of the same number. Tier 0 still does.
# Pointing the Qwen3-1.7B-Math recipes at the same protocol would restore
# comparability; that is a separate change, not made here.
#
# `server.max_model_len` is deliberately absent here: it differs per tier
# because it must exceed that tier's `sampling.max_new_tokens` with room left
# for the prompt, which the recipe loader enforces.

server:
  # The released Hugging Face weights, staged onto the VM's local disk from
  # the bucket; vLLM reads the safetensors directly.
  model_path: models/DeepSeek-R1-Distill-Qwen-1.5B
  served_model_name: null
  # DeepSeek's chat template closes each turn with the tokenizer's own
  # end-of-sentence token, and its generation_config.json names that id
  # (151643) as the EOS. The bars are full-width characters: this string
  # must match the tokenizer's exactly.
  turn_end_token: <｜end▁of▁sentence｜>
  serve_command: ["scripts/run_vllm_tpu_container.sh"]
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 1
  # ~15 minutes. TPU startup includes weight transfer and an XLA compilation,
  # neither of which is fast the first time.
  startup_timeout_secs: 900
  extra_args: []
  # Bounds the runner's concurrent in-flight chat completion requests. One
  # TPU chip serving one model at a time: wide enough to keep the server
  # busy through generation latency, not so wide that queued requests starve
  # each other's decode step. At the 36864-token window every card-bearing
  # tier now asks for, eight concurrent sequences is about 8 GiB of KV cache
  # on a 32 GiB v6e chip, so this width is bounded by decode economics rather
  # than by memory.
  max_concurrency: 8
  # Consecutive request failures (after each has exhausted its own retries)
  # before the runner stops the whole tier rather than grinding through
  # every remaining document against a dead server.
  fail_fast_after: 10

reporting:
  summary_path: null
  # Null on purpose: the chat template appends `<think>\n` to the generation
  # prompt, so a completion can never carry the opening tag and a trace
  # counts as closed when the closing tag appears.
  reasoning_start: null
  reasoning_end: </think>
  answer_marker: "\\boxed{"
  wandb:
    project_name: open-r1-tpu
    entity: null
    mode: online
    job_type: eval
    run_id: null
