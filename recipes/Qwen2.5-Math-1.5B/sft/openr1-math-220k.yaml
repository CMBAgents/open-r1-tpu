# Reasoning distillation: a full-parameter SFT of Qwen2.5-Math-1.5B on the
# DeepSeek-R1 traces in OpenR1-Math-220k. DeepSeek distilled the same base into
# DeepSeek-R1-Distill-Qwen-1.5B with a closed corpus; this uses a public one.
# Tested on a TPU v6e-4 (4 chips): peak HBM 19.69 of 31.25 GiB per chip, about
# 10.2 s per optimizer step, 6,710 steps in about 19 hours, final train loss
# 0.30. The export scores MATH-500 0.833 +/- 0.011 on ../eval/tier1_core.yaml,
# against 0.798 +/- 0.013 for DeepSeek's distill.
#
# Stage on the VM (set_rope.py makes the long-context base; see rope_theta):
#   hf download open-r1/OpenR1-Math-220k --repo-type dataset \
#     --include 'data/*' --local-dir data/OpenR1-Math-220k
#   hf download Qwen/Qwen2.5-Math-1.5B --local-dir models/Qwen2.5-Math-1.5B-RoPE-300k
#   python scripts/set_rope.py models/Qwen2.5-Math-1.5B-RoPE-300k \
#     --rope-theta 300000 --max-position-embeddings 32768
# Launch:
#   RECIPE=recipes/Qwen2.5-Math-1.5B/sft/openr1-math-220k.yaml ./scripts/run_sft_tpu.sh
model:
  model_name: qwen2.5-math-1.5b
  model_id: Qwen/Qwen2.5-Math-1.5B
  # Local, because only the local source forwards ModelConfig fields such as
  # rope_theta, and because the export copies this directory's config.json:
  # stage the RoPE-300k variant here or the export will declare theta 10000.
  model_source: local
  model_path: models/Qwen2.5-Math-1.5B-RoPE-300k
  model_download_path: /tmp/open-r1-tpu/models/qwen2.5-math-1.5b
  intermediate_ckpt_dir: /tmp/open-r1-tpu/intermediate_ckpt
  rng_seed: 42
  model_display: false
  dtype: bfloat16
  load_dtype: bfloat16
  # The most aggressive setting already: only decoder layer inputs are kept.
  remat_config: DECODER
  use_flash_attention: true
  # Must divide dataset.max_length; change the two together.
  flash_attention_block_size: 1024
  # No lora_config: the embeddings are tied, so the <|im_end|> row sits in the
  # one matrix LoRA freezes. This is a full fine-tune.
  #
  # The stock base declares a 4096-token context at theta 10000, and this
  # window runs 6.5x past it; left at 10000, the model fell into repetition
  # loops. open-r1 found theta 100k, 300k and 500k equivalent and kept 300k.
  # Tunix's preset hardcodes 10000 and drops unknown keys silently, so the
  # field name must match ModelConfig exactly.
  rope_theta: 300000
  mesh:
    # Tunix keeps the logits in float32: one 26,624-token window is 16.2 GB of
    # logits, plus as much again for their gradient, which one chip cannot
    # hold. tp shards the vocabulary axis and halves that; tp=4 is not
    # possible because the model has only 2 KV heads.
    shape: [2, 2]
    axis_names: [fsdp, tp]

tokenizer:
  tokenizer_path: Qwen/Qwen2.5-Math-1.5B
  tokenizer_type: huggingface
  add_bos: false
  add_eos: false
  # The tokeniser's own ChatML template, which renders content verbatim, so
  # <think>...</think> traces survive. It inserts a default system message
  # when a conversation has none; dataset.system_prompt_file always supplies
  # one.
  chat_template: null

dataset:
  # 93,733 verified maths problems with DeepSeek-R1 traces (Apache 2.0), one
  # user and one assistant turn each, in the default `messages` schema. Read
  # from the Parquet staged above; to read the Hub instead, override
  # dataset.name=open-r1/OpenR1-Math-220k dataset.config=default
  # dataset.data_files=null.
  name: parquet
  config: null
  train_split: train
  # The `default` config's train shards only: the `extended` and `all` configs
  # cover the same problems, so a broader glob would train on duplicates.
  data_files: data/OpenR1-Math-220k/data/train-*.parquet
  messages_column: messages
  # One window per fsdp shard; the effective batch comes from accumulation.
  batch_size: 2
  # 26 x 1024: the smallest multiple of flash_attention_block_size above the
  # longest templated example (25,733 tokens; median 4,952, p99 16,834), so
  # nothing is dropped or truncated. If HBM is short, 24576 drops 1 example,
  # 16384 drops 1,450 (1.55%) and 8192 drops 22,951 (24.5%).
  max_length: 26624
  # Packing gives 21,485 windows per epoch at 98.1% fill; unpacked, the mean
  # example fills 22.5% of the window. Attention never crosses example
  # boundaries, and RoPE positions restart at each example.
  packing: true
  num_train_epochs: 6
  max_examples: null
  # Disabled. If enabled, watch peak HBM: evaluation raises it.
  eval_fraction: 0.0
  eval_max_examples: 64
  seed: 42
  # Loss on assistant turns only. Examples whose rendering is not
  # prefix-stable are dropped rather than trained with a guessed mask.
  assistant_only_loss: true
  # Drops the 179 rows (0.19%) with no closed <think> block, a format the
  # evaluation scores as a failure.
  require_reasoning_tags: true
  # Plain text to this tokeniser, not special tokens: <think> tokenises as
  # ['<th', 'ink', '>'].
  reasoning_start: <think>
  reasoning_end: </think>
  # Rows carry no system message, so this is prepended to every example. The
  # eval tiers send the same file.
  system_prompt_file: recipes/Qwen2.5-Math-1.5B/system_prompt.txt

optimizer:
  # Higher than open-r1's 4.0e-5 for 7B, at which train loss plateaued near
  # 0.45 by step 600. Watch the first ~250 steps, through peak LR, for spikes.
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  b1: 0.9
  b2: 0.999
  eps: 1.0e-8
  # Decay on a full fine-tune would pull the pretrained weights towards zero.
  weight_decay: 0.0
  # open-r1's value. If the logged gradient norm approaches it, the clip is
  # rescaling the learning rate.
  max_grad_norm: 0.2

training:
  # Five epochs, open-r1's count: 1,342 steps per epoch at 16 windows per step.
  # num_train_epochs is 6 so the input pipeline cannot run dry first.
  max_steps: 6710
  # 16 windows, 425,984 tokens and about 70 examples per optimizer step.
  gradient_accumulation_steps: 8
  # Inert while eval_fraction is 0.0.
  eval_every_n_steps: 250
  checkpoint_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/checkpoints
  checkpointing_options:
    # Each full-state checkpoint (bf16 parameters, fp32 Adam moments) is about
    # 15.5 GB.
    save_interval_steps: 250
    max_to_keep: 2
    # An async save holds the live train state, defeating buffer donation and
    # briefly doubling parameters and Adam moments on device, which can OOM.
    # Blocking costs a few percent of throughput.
    enable_async_checkpointing: false
    timeout_secs: 1200
  metrics_log_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/logs
  project_name: open-r1-tpu
  # Unique per recipe, so wandb.resume: allow never appends to another run.
  run_name: qwen2.5-math-1.5b-r1-distill-sft-rope300k-lr2e4
  flush_every_n_steps: 10
  wandb:
    enabled: true
    # Leave null to use WANDB_ENTITY or the account's default entity.
    entity: null
    mode: online
    group: qwen2.5-math-1.5b-reasoning-distillation
    job_type: sft
    tags: [tpu, sft, full-finetune, qwen2.5, math, reasoning, v6e-4]
    resume: allow
    save_code: true
  # Off: sampling adds a decode compilation and a KV cache. Turn it on to see
  # whether the model closes </think> and stops.
  transcripts:
    enabled: false
    every_n_steps: 250
    max_new_tokens: 512
    # Greedy, so samples compare across steps.
    temperature: 0.0
    seed: 42
    log_to_wandb: true
    output_path: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/transcripts.jsonl
    # Leave null to use the built-in prompt set.
    prompts: null
    # Defaults to max_prompt_length + max_new_tokens.
    cache_size: null
    # Null derives it from model.flash_attention_block_size, which must divide
    # the prompt length.
    max_prompt_length: null
  data_sharding_axis: [fsdp]
  max_inflight_computations: 1

export:
  # An unsharded Hugging Face checkpoint for vLLM, with the base's config and
  # tokeniser files. The export adds <|im_end|> to generation_config.json's
  # EOS ids: the base lists only <|endoftext|>, so a server would never stop at
  # the end of a turn.
  enabled: true
  overwrite: true
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/merged
