# GRPO on the SFT export (../sft/openr1-math-220k.yaml) with the English
# DAPO-Math-17k prompts, rewarding format and correctness
# (src/open_r1_tpu/grpo/rewards.py). Sized for one TPU v6e-1 chip, which holds
# the LoRA actor, the frozen reference and the rollout engine.
#
# Not yet run: step time and peak HBM are unmeasured, so run a short smoke
# (e.g. training.max_steps=3 training.wandb.enabled=false) before trusting
# max_steps.
#
# Run the SFT recipe first; its export is model.model_path. Stage the prompts
# with ./scripts/copy_gcs_bucket_data.sh --dataset DAPO-Math-17k-Processed (or
# read the Hub; see dataset.name), then launch:
#   python -m open_r1_tpu.grpo.run \
#     --config recipes/Qwen2.5-Math-1.5B/grpo/dapo-math-17k.yaml
model:
  model_name: qwen2.5-math-1.5b
  model_id: Qwen/Qwen2.5-Math-1.5B
  model_source: local
  # Loaded twice: with lora_config as the actor, and without as the frozen
  # reference for the KL term.
  model_path: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/merged
  model_download_path: /tmp/open-r1-tpu/models/qwen2.5-math-1.5b-grpo
  intermediate_ckpt_dir: /tmp/open-r1-tpu/intermediate_ckpt-grpo
  rng_seed: 42
  model_display: false
  # Float32 and plain attention: bfloat16 or splash attention corrupts Qwen2
  # GRPO rollouts on the pinned Tunix (see ../../Qwen2.5-1.5B/grpo/
  # simplerl-zoo.yaml).
  dtype: float32
  load_dtype: float32
  remat_config: DECODER
  use_flash_attention: false
  flash_attention_block_size: 1024
  # Must match the SFT recipe. The loader reads this field, not the export's
  # config.json.
  rope_theta: 300000
  # LoRA suffices here, unlike at SFT: the export already has <|im_end|> and
  # the reasoning format in its weights, so the adapter only reshapes the
  # policy.
  lora_config:
    module_path: ".*q_proj|.*k_proj|.*v_proj|.*o_proj|.*gate_proj|.*up_proj|.*down_proj"
    rank: 64
    alpha: 64.0
  mesh:
    shape: [1, 1]
    axis_names: [fsdp, tp]

tokenizer:
  # Unused with model_source: local, which takes the tokeniser from the staged
  # directory; kept equal to the SFT recipe's.
  tokenizer_path: Qwen/Qwen2.5-Math-1.5B
  tokenizer_type: huggingface
  add_bos: false
  add_eos: false
  chat_template: null

dataset:
  # open-r1/DAPO-Math-17k-Processed, `en` config: 14,116 deduplicated English
  # competition problems (arXiv 2503.14476) from Open-R1's GRPO recipes, each
  # with a bare-integer answer that grpo/rewards.py compares exactly. The SFT
  # model never trained on these prompts, so its rollouts still differ within
  # a group, which is what GRPO learns from. `prompt` is the bare problem, so
  # the system prompt is the only format instruction, as at SFT and
  # evaluation.
  #
  # Read from the staged Parquet; to read the Hub instead, override
  # dataset.name=open-r1/DAPO-Math-17k-Processed dataset.config=en
  # dataset.data_files=null.
  name: parquet
  config: null
  train_split: train
  # The `en` shard only; `all` adds 3,282 Chinese prompts.
  data_files: data/DAPO-Math-17k-Processed/en/train-*.parquet
  question_column: prompt
  answer_column: solution
  # 4 prompts x grpo.num_generations 4 = 16 rollouts per step.
  batch_size: 4
  # Drops rows whose rendered prompt exceeds this. Problems are short
  # (longest 3,190 characters), so few if any are dropped.
  max_prompt_length: 512
  # 3,529 steps per epoch, far beyond max_steps; this only keeps the iterator
  # from running dry.
  num_train_epochs: 20
  max_examples: null
  eval_fraction: 0.0
  eval_max_examples: 64
  seed: 42
  system_prompt_file: recipes/Qwen2.5-Math-1.5B/system_prompt.txt

optimizer:
  # A low learning rate and tight clip, close to Tunix's
  # examples/grpo_gemma.ipynb, which found the clip important for keeping the
  # KL divergence in check.
  learning_rate: 3.0e-6
  warmup_ratio: 0.1
  min_lr_ratio: 0.0
  b1: 0.9
  b2: 0.99
  eps: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 0.1

training:
  # A starting point for the smoke run to check, not a measured budget.
  max_steps: 500
  checkpoint_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/grpo-checkpoints
  checkpointing_options:
    save_interval_steps: 50
    max_to_keep: 2
    enable_async_checkpointing: false
    timeout_secs: 1200
  # Inert while dataset.eval_fraction is 0.0.
  eval_every_n_steps: 50
  metrics_log_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/grpo-logs
  project_name: open-r1-tpu
  run_name: qwen2.5-math-1.5b-r1-distill-grpo-v1
  flush_every_n_steps: 5
  wandb:
    enabled: true
    entity: null
    mode: online
    group: qwen2.5-math-1.5b-reasoning-grpo
    job_type: grpo
    tags: [tpu, grpo, rl, qwen2.5, math, reasoning, v6e-1]
    resume: allow
    save_code: true
  offload_to_cpu: false

grpo:
  # Rollouts per prompt. A larger group gives a less noisy relative advantage
  # (grpo_gemma.ipynb uses 2).
  num_generations: 4
  num_iterations: 1
  # grpo_gemma.ipynb's value, above GRPOConfig's default of 0.04: lower lets
  # the KL divergence grow unchecked.
  beta: 0.08
  epsilon: 0.2

rollout:
  # kv_cache_size must be at least max_prompt_length + max_tokens_to_generate;
  # the extra 256 is the headroom Tunix's GRPO examples use.
  max_prompt_length: 512
  max_tokens_to_generate: 4096
  kv_cache_size: 4864
  # High for varied rollouts, as in grpo_gemma.ipynb; evaluation uses 0.6.
  temperature: 0.9
  top_p: 1.0
  top_k: 50

export:
  # Off until a smoke run looks right. The Qwen2 merged-LoRA export works
  # (tested with ../../Qwen2.5-1.5B/grpo/simplerl-zoo.yaml).
  enabled: false
  overwrite: true
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/grpo-merged
