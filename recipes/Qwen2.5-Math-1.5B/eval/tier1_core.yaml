# Tier 1: the decision tier, about an hour per checkpoint worth keeping.
# MATH-500 over three seeds: 500 problems spanning difficulty, and seed
# variance alone moves reasoning benchmarks by 5-15 points (arXiv 2504.07086),
# more than most recipe changes are worth.
#
# Task, seeds and sampling match ../../DeepSeek-R1-Distill-Qwen-1.5B/eval/
# tier1_core.yaml (tests/test_evaluate.py keeps them matched), so the two
# compare directly; only the prompt differs, as this export keeps its training
# system prompt and DeepSeek's distill runs without one. Measured: the SFT
# export 0.833 +/- 0.011, DeepSeek-R1-Distill-Qwen-1.5B 0.798 +/- 0.013.
# Neither is the card's 83.9, measured at 32768 tokens; base.yaml says how to
# run that protocol.
extends: base.yaml

eval:
  tier: tier1-core
  tasks:
    - "math_500|0"
    # AMC23 is not in LightEval's table, and at 40 problems it would decide
    # nothing MATH-500 does not.
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 20480

sampling:
  # DeepSeek-R1's recommended settings, used by most published numbers for
  # distilled reasoning models. Greedy decoding loops too often on a reasoning
  # model and makes pass@k meaningless.
  temperature: 0.6
  top_p: 0.95
  # A trace cut off at the cap scores as wrong, so watch
  # generation.truncation_rate: if it is not near zero, the accuracy
  # understates the model. Training traces ran to 25,733 tokens, past this cap.
  max_new_tokens: 16384
  system_prompt_file: recipes/Qwen2.5-Math-1.5B/system_prompt.txt

reporting:
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/eval/tier1
  wandb:
    enabled: true
    run_name: qwen2.5-math-1.5b-r1-distill-tier1
    tags: [tpu, eval, math]
