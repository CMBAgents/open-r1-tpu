# Tier 0: a five-minute smoke test to run after every training run. It catches
# a model broken in ways loss cannot show: traces that never close, generation
# past the end of the turn, repetition loops. If it looks wrong, skip Tier 1.
#
# Greedy, one seed, 200 GSM8K problems: a tripwire, not a benchmark score.
# Read generation.reasoning_closed_rate, truncation_rate and format_rate in the
# summary first. <think> is plain text to this tokeniser, so a misspelt
# opening tag shows up in format_rate.
extends: base.yaml

eval:
  tier: tier0-smoke
  tasks:
    - "gsm8k|0"
  # Greedy decoding has no sampling variance to average out.
  seeds: [0]
  # Enough to expose a systematic format failure, far too few to score.
  max_samples: 200

server:
  max_model_len: 12288

sampling:
  # Greedy, so smoke tests compare run to run and repetition loops show up
  # rather than being sampled around.
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 8192
  # The file training prepended to every example, so the two stay in step.
  system_prompt_file: recipes/Qwen2.5-Math-1.5B/system_prompt.txt

reporting:
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/eval/tier0
  wandb:
    enabled: false
    run_name: qwen2.5-math-1.5b-r1-distill-tier0
    tags: [tpu, eval, smoke]
