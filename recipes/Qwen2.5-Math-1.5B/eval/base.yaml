# Shared settings for the eval tiers of the Qwen2.5-Math-1.5B SFT export
# (../sft/openr1-math-220k.yaml). Each tier `extends` this file and sets its
# own tasks, seeds, context window and sampling. With the environment from
# scripts/setup_tpu_vm.sh --with-eval, run a tier on one v6e chip:
#   RECIPE=recipes/Qwen2.5-Math-1.5B/eval/tier0_smoke.yaml ./scripts/run_eval_tpu.sh
# Add server.model_path=models/Qwen2.5-Math-1.5B to score the untrained base on
# the same stack.
#
# These tiers are this project's protocol, not the DeepSeek model card's
# (AIME24 28.9, MATH-500 83.9, GPQA 33.8). For the card's, run
# ../../DeepSeek-R1-Distill-Qwen-1.5B/eval's tiers with server.model_path,
# server.turn_end_token, server.extra_args and reporting.reasoning_start set
# to the values below. Tier 1 shares its generation settings with that
# directory's tier 1.

server:
  # Each tier sets max_model_len, which must exceed its
  # sampling.max_new_tokens with room for the prompt.
  #
  # The merged Hugging Face export the SFT recipe writes (vLLM reads
  # safetensors, not Orbax checkpoints), staged on local disk.
  model_path: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/merged
  served_model_name: null
  # ChatML's turn end. Preflight checks that the export's
  # generation_config.json lists its id (151645) as an EOS, which is what stops
  # vLLM at the end of a turn; the base model's lists only <|endoftext|>.
  turn_end_token: <|im_end|>
  # Runs vLLM in the local image built from docker/vllm-tpu. Leaving
  # server.image unset selects that image's tag.
  serve_command: ["scripts/run_vllm_tpu_container.sh"]
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 1
  # First start includes weight transfer and XLA compilation.
  startup_timeout_secs: 900
  # The export copies config.json from its base. The RoPE-300k base declares
  # 32768 positions; stock Qwen2.5-Math-1.5B declares 4096, and vLLM refuses a
  # longer window, so this keeps either servable. rope_theta is never
  # overridden: serve at the theta the model was trained at.
  extra_args: ["--hf-overrides", '{"max_position_embeddings": 32768}']
  # Concurrent chat requests: enough to keep one chip busy without queued
  # requests starving each other's decode steps.
  max_concurrency: 8
  # Consecutive failed requests, each after its own retries, before the tier
  # stops.
  fail_fast_after: 10

reporting:
  summary_path: null
  # <think> is plain text to this tokeniser, and the ChatML template does not
  # open the block in the prompt, so completions carry both tags and closure
  # is judged on the pair.
  reasoning_start: <think>
  reasoning_end: </think>
  answer_marker: "\\boxed{"
  wandb:
    project_name: open-r1-tpu
    entity: null
    mode: online
    job_type: eval
    # Set to the training run's W&B id to log these numbers on that run
    # (W&B resumes by id, not by name).
    run_id: null
