# Tier 3: what the maths-only SFT cost in instruction following and science
# QA, for milestones only. Read the numbers as deltas against the base on the
# same stack (server.model_path=models/Qwen2.5-Math-1.5B): a 1.5B model scores
# near the floor on GPQA whatever is done to it. At 4096 tokens much of the
# GPQA score is truncation, so this is a regression reading, not the card's
# 33.8; ../../DeepSeek-R1-Distill-Qwen-1.5B/eval/tier5_gpqa.yaml runs that.
#
# Only generative tasks work. An OpenAI-compatible endpoint returns no log
# probabilities for a supplied continuation, so loglikelihood-scored tasks
# (plain MMLU, HellaSwag, ARC and multiple choice generally) cannot run here.
extends: base.yaml

eval:
  tier: tier3-regression
  tasks:
    - "ifeval|0"
    - "gpqa:diamond|0"
    # No broad-knowledge task: MMLU-Pro is not in LightEval's table, and its
    # nearest, mmlu_redux_2, is multiple choice.
  seeds: [0, 1, 2]
  max_samples: null

server:
  max_model_len: 8192

sampling:
  temperature: 0.6
  top_p: 0.95
  # Shorter than the maths tiers: these are not long-reasoning benchmarks.
  max_new_tokens: 4096
  # Null: the training prompt asks for a reasoning trace, which IFEval scores
  # as an instruction failure. The ChatML template then inserts its own
  # default system message ("Please reason step by step, and put your final
  # answer within \boxed{}."), so the model gets the base's stock line, not
  # no prompt as the DeepSeek reference does.
  system_prompt_file: null

reporting:
  output_dir: artifacts/OpenR1-Distill-Qwen2.5-Math-1.5B/eval/tier3
  wandb:
    enabled: true
    run_name: qwen2.5-math-1.5b-r1-distill-tier3
    tags: [tpu, eval, regression]
