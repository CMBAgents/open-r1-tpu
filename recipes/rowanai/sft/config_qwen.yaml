# Matched examples and updates; see ../README.md before launching.
model:
  model_name: qwen2.5-math-1.5b
  model_id: Qwen/Qwen2.5-Math-1.5B
  model_source: local
  model_path: models/Qwen2.5-Math-1.5B-RoPE-300k
  model_download_path: /tmp/open-r1-tpu/models/Qwen2.5-Math-1.5B-RoPE-300k
  intermediate_ckpt_dir: /tmp/open-r1-tpu/intermediate_ckpt/qwen
  rng_seed: 42
  model_display: false
  dtype: bfloat16
  load_dtype: bfloat16
  remat_config: DECODER
  use_flash_attention: true
  flash_attention_block_size: 1024
  rope_theta: 300000
  mesh:
    shape:
    - 2
    - 2
    axis_names:
    - fsdp
    - tp
tokenizer:
  tokenizer_path: models/Qwen2.5-Math-1.5B-RoPE-300k
  tokenizer_type: huggingface
  add_bos: false
  add_eos: false
  chat_template: null
dataset:
  name: json
  config: null
  train_split: train
  data_files: data/rowanai/train.jsonl
  messages_column: messages
  batch_size: 2
  max_length: 3072
  packing: false
  num_train_epochs: 5
  max_examples: null
  eval_fraction: 0.0
  eval_max_examples: 64
  seed: 42
  assistant_only_loss: true
  require_reasoning_tags: false
  reasoning_start: <think>
  reasoning_end: </think>
  system_prompt_file: null
optimizer:
  learning_rate: 0.0002
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  b1: 0.9
  b2: 0.999
  eps: 1.0e-08
  weight_decay: 0.0
  max_grad_norm: 0.2
training:
  max_steps: 709
  gradient_accumulation_steps: 8
  eval_every_n_steps: 250
  checkpoint_dir: artifacts/rowanai-comparison/qwen/checkpoints
  checkpointing_options:
    save_interval_steps: 100
    max_to_keep: 2
    enable_async_checkpointing: false
    timeout_secs: 1200
  metrics_log_dir: artifacts/rowanai-comparison/qwen/logs
  project_name: open-r1-tpu
  run_name: rowanai-comparison-qwen
  flush_every_n_steps: 10
  wandb:
    enabled: true
    entity: null
    mode: online
    group: rowanai-comparison
    job_type: sft
    tags:
    - tpu
    - sft
    - full-finetune
    - pre1905
    - qwen
    resume: allow
    save_code: false
  transcripts:
    enabled: false
    every_n_steps: 250
    max_new_tokens: 512
    temperature: 0.0
    seed: 42
    log_to_wandb: true
    output_path: artifacts/rowanai-comparison/qwen/transcripts.jsonl
    prompts: null
    cache_size: null
    max_prompt_length: null
  data_sharding_axis:
  - fsdp
  max_inflight_computations: 1
export:
  enabled: true
  overwrite: false
  output_dir: artifacts/rowanai-comparison/qwen/merged
