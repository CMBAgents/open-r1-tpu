  lcb:codegeneration|0:
    evaluation_splits:
    - test
    example:
      choices:
      - ''
      gold_index: 0
      query: 'You will be given a question (problem specification) and will generate
        a correct Python program that matches the specification and passes all tests.


        Question: You are given N linear functions f_1, f_2, \ldots, f_N, where f_i(x)
        = A_i x + B_i.

        Find the maximum possible value of f_{p_1}(f_{p_2}(\ldots f_{p_K}(1) \ldots
        )) for a sequence p = (p_1, p_2, \ldots, p_K) of K distinct integers between
        1 and N, inclusive.


        Input


        The input is given from Standard Input in the following format:

        N K

        A_1 B_1

        A_2 B_2

        \vdots

        A_N B_N


        Output


        Print the answer as an integer.


        Constraints



        - 1 \leq N \leq 2 \times 10^{5}

        - 1 \leq K \leq \text{min}(N,10)

        - 1 \leq A_i, B_i \leq 50 (1 \leq i \leq N)

        - All input values are integers.


        Sample Input 1


        3 2

        2 3

        1 5

        4 2


        Sample Output 1


        26


        Here are all possible p and the corresponding values of f_{p_1}(f_{p_2}(1)):


        - p= ( 1,2 ) : f_1(f_2(1))=15

        - p= ( 1,3 ) : f_1(f_3(1))=15

        - p= ( 2,1 ) : f_2(f_1(1))=10

        - p= ( 2,3 ) : f_2(f_3(1))=11

        - p= ( 3,1 ) : f_3(f_1(1))=22

        - p= ( 3,2 ) : f_3(f_2(1))=26


        Therefore, print 26.


        Sample Input 2


        10 3

        48 40

        34 22

        24 37

        45 40

        48 31

        49 44

        45 40

        44 6

        35 22

        39 28


        Sample Output 2


        216223


        Read the inputs from stdin solve the problem and write the answer to stdout
        (do not directly test on the sample inputs). Enclose your code within delimiters
        as follows. Ensure that when the python program runs, it reads the inputs,
        runs the algorithm and writes output to STDOUT.

        ```python

        # YOUR CODE HERE

        ```


        '
      specific:
        keys:
        - fn_name
        - inputs
        - outputs
        omitted_chars: 21048372
    few_shots_select: null
    few_shots_split: null
    generation_size: 32768
    hf_avail_splits:
    - test
    hf_repo: lighteval/code_generation_lite
    hf_revision: null
    hf_subset: v4_v5
    metrics:
    - batched_compute: false
      category: GENERATIVE
      corpus_level_fn:
        codegen_pass@1:16: mean
      higher_is_better: true
      metric_name: codegen_pass@1:16
      sample_level_fn_class: lighteval.tasks.tasks.lcb.main.CodegenMetric
    name: lcb:codegeneration|0
    num_fewshots: 0
    prompt_function_ref: lighteval.tasks.tasks.lcb.main:lcb_codegeneration_prompt_fn
    stop_sequence: []
    version: 0
