# Example tracing configuration -- copy to configs/tracing.yaml (gitignored)
# and replace the placeholder host/port with real values. Nothing here is a
# real deployment identifier.
#
# Loaded and validated by `open_r1_tpu.tracing.config`; see its module
# docstring for the schema. `docker/langfuse/README.md` explains how
# `langfuse.host`/`langfuse.port` here must agree with docker/langfuse/.env's
# LANGFUSE_WEB_PORT.
#
# Secrets are not config: LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY are read
# from the environment (see `evaluation.experiment`/`evaluation.dataset_sync`),
# never written into this file.

langfuse:
  host: 127.0.0.1
  port: 3000
