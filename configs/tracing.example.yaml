# Example tracing config, needed only to trace evaluations in Langfuse
# (TRACE_CONFIG). scripts/gen_langfuse_env.sh writes the real, gitignored
# configs/tracing.yaml; to write it by hand, copy this file.
#
# host and port are where the evaluation reaches langfuse-web: the stack host's
# LANGFUSE_WEB_BIND and LANGFUSE_WEB_PORT (docker/langfuse/README.md). The
# schema is validated by `open_r1_tpu.evaluation.traced`. The API keys are read
# from LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in the environment, never from
# this file.

langfuse:
  host: 127.0.0.1
  port: 3000
