# Trace-capture litellm proxy: a transparent relay between LightEval and
# vLLM that logs every request/response to GCS on the way through. Loaded by
# scripts/run_trace_proxy.sh, opt-in per launch via run_eval_tpu.sh's
# TRACE_PROXY=1 (see that script's header).
#
# Every deployment-specific value here is an `os.environ/...` reference
# (litellm's env-interpolation syntax), populated by run_trace_proxy.sh from
# the tracing config -- this file itself carries none.
#
# No message-redaction setting is set (`turn_off_message_logging` defaults to
# false): full prompts and completions in the logged payload are the entire
# point of this proxy.
#
# Logging goes through gcs_logger.py (same directory), a free custom
# callback -- litellm's own `gcs_bucket` success callback is gated behind an
# Enterprise license and cannot be used here. See that file's module
# docstring for the full explanation and the citation against the pinned
# litellm version's source.

model_list:
  - model_name: "*"
    litellm_params:
      # Wildcard passthrough: forwards whatever model name LightEval
      # requests straight to the upstream vLLM server via the same
      # `hosted_vllm` provider open_r1_tpu.evaluation.run.litellm_model_config
      # already uses, so the proxy changes nothing about how the request is
      # routed -- only that it is logged on the way through.
      model: "hosted_vllm/*"
      api_base: os.environ/TRACE_PROXY_UPSTREAM_BASE_URL
      # The upstream is local and unauthenticated, but litellm refuses to
      # send a request carrying no key at all -- the same "local" placeholder
      # open_r1_tpu.evaluation.run.litellm_model_config uses.
      api_key: "local"

litellm_settings:
  callbacks: gcs_logger.proxy_handler_instance
